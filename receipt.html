<title>Receipt — N&amp;R SOLARTECH SOLUTION</title>
<style>
  :root{--ink:#16232d;--dim:#5a7285;--line:#dde5ec;--teal:#0f6d7a;--save:#0d7a4a;--page:#eef2f6}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);line-height:1.45;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:14px;display:flex;justify-content:center}
  .paper{background:#fff;border-radius:14px;padding:20px 20px 16px;width:min(560px,100%);
    box-shadow:0 8px 26px rgba(0,0,0,.14)}
  .head{display:flex;align-items:center;gap:13px;margin-bottom:8px}
  .head img{width:74px;height:74px;border-radius:12px;display:block}
  .head h1{margin:0;font-size:19px;letter-spacing:.2px}
  .head .sub{font-size:13px;color:var(--dim)}
  .meta{color:var(--dim);font-size:13px;margin:6px 0 12px;word-break:break-word}
  .r{display:flex;justify-content:space-between;gap:14px;padding:6px 0;
    border-bottom:1px dotted #e3eaf0}
  .r:last-child{border-bottom:0}
  .r > span:first-child{min-width:0;flex:1}
  .r > span:last-child{white-space:nowrap;text-align:right}
  .tot{border-top:2px solid var(--ink);border-bottom:0;margin-top:8px;padding-top:8px;
    font-weight:800;font-size:19px;color:var(--teal)}
  .save{background:#e9f7f0;border:1px solid #bfe6d4;border-radius:10px;padding:10px 12px;margin-top:12px}
  .save .rates{font-size:12px;color:#2d5f4c;margin-bottom:4px}
  .save .sline{display:flex;justify-content:space-between;gap:12px;font-size:13px;
    color:#2d5f4c;padding:2px 0}
  .save .sline b{color:var(--save);font-size:16px;white-space:nowrap}
  .foot{font-size:12.5px;color:var(--dim);text-align:center;margin:14px 0 0;
    border-top:1px dashed #cfd8e0;padding-top:12px}
  .btn{display:block;width:100%;margin-top:12px;padding:12px;border-radius:10px;border:0;
    background:var(--teal);color:#fff;font-size:16px;font-weight:700}
  .bad{background:#fff3f3;border:1px solid #f3c6c6;color:#8a1f24;border-radius:10px;padding:14px}
  @media print{ body{background:#fff;padding:0} .paper{box-shadow:none} .btn{display:none} }
</style></head>

function q(k){
  var h = location.hash.replace(/^#/,"").split("&");
  for (var i=0;i<h.length;i++){
    var p = h[i].split("=");
    if (decodeURIComponent(p[0]) === k) return decodeURIComponent((p[1]||"").replace(/\+/g," "));
  }
  return "";
}
function peso(v){
  var n = Number(v);
  if (!isFinite(n)) return "";
  return "\u20B1" + n.toLocaleString("en-PH",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function when(d){                       /* 202609180852 -> 18 Sep 2026, 8:52 AM */
  if (!/^\d{12}$/.test(d)) return d || "";
  var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var y=d.slice(0,4), mo=+d.slice(4,6), da=+d.slice(6,8), hh=+d.slice(8,10), mi=d.slice(10,12);
  var ap = hh>=12 ? "PM":"AM", h12 = hh%12 || 12;
  return da+" "+M[mo-1]+" "+y+", "+h12+":"+mi+" "+ap;
}
function month(p){                      /* 202606 -> Jun 2026 */
  var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return /^\d{6}$/.test(p) ? M[+p.slice(4,6)-1]+" "+p.slice(0,4) : p;
}
function lines(f){
  /* E202606:149:8:1192  = electricity, June 2026, 149 kWh at 8, P1,192
     N202606:600         = internet
     older receipts: E202606:1192 */
  if (!f) return "";
  var LBL = {E:"", N:"Internet \u2014 ", L:"Late fee \u2014 "};
  return f.split(";").map(function(bit){
    var parts = bit.split(":");
    var head  = parts[0] || "";
    var kind  = head.charAt(0), per = head.slice(1);
    var amt   = parts[parts.length-1];
    var units = parts.length >= 4 ? (parts[1]+" kWh \u00d7 "+peso(parts[2])) : "";
    return "<div class='r'><span>"+(LBL[kind]||"")+month(per)+
      (units ? " \u00b7 "+units : "")+"</span><span>"+peso(amt)+"</span></div>";
  }).join("");
}

(function(){
  var out = document.getElementById("out");
  var or = q("o"), name = q("n");
  if (!or && !name){
    out.className = "bad";
    out.innerHTML = "<b>Nothing to show</b><br>Open this page by scanning the QR code on your receipt.";
    return;
  }
  var cash = q("c"), saved = q("s"), total = q("ts"), grid = q("g"), rate = q("v");
  var bal = q("b"), credit = q("cr"), site = q("t");
  /* the rate is on the first electricity line when it is not sent on its own */
  if (!rate){
    var m = /E\d{6}:[^:;]+:([^:;]+):/.exec(q("f") || "");
    if (m) rate = m[1];
  }
  out.innerHTML =
    "<div class='head'><img alt='' src='"+LOGO+"'>"+
      "<div><h1>N&amp;R SOLARTECH SOLUTION</h1>"+
      "<div class='sub'>Solar &amp; internet</div></div></div>"+
    "<div class='meta'>"+or+(q("d") ? " \u00b7 "+when(q("d")) : "")+"</div>"+
    "<div class='r'><b>"+name+"</b><span>"+(site||"")+"</span></div>"+
    lines(q("f"))+
    "<div class='r tot'><span>Paid</span><span>"+peso(q("a"))+"</span></div>"+
    (cash ? "<div class='r'><span>Cash inserted</span><span>"+
        cash.split(" ").map(function(bit){
          var q = bit.split("x");
          return q.length===2 ? q[0]+" \u00d7 "+peso(q[1]) : bit;
        }).join(" + ")+"</span></div>" : "")+
    (bal ? "<div class='r'><span>Remaining balance</span><span>"+peso(bal)+"</span></div>" : "")+
    (credit ? "<div class='r'><span>Credit on your account</span><span style='color:#0d7a4a;font-weight:700'>"+
        peso(credit)+"</span></div>" : "")+
    ((saved || total) ?
      "<div class='save'>"+
        ((rate && grid) ? "<div class='rates'>Our rate <b>"+peso(rate)+"</b>/kWh \u00b7 ORMECO <b>"+
            peso(grid)+"</b>/kWh</div>" : "")+
        (saved ? "<div class='sline'><span>Saved on these months</span><b>"+peso(saved)+"</b></div>" : "")+
        (total ? "<div class='sline'><span>Saved since you joined</span><b>"+peso(total)+"</b></div>" : "")+
      "</div>" : "")+
    "<p class='foot'>This is a copy of your kiosk receipt, read from the code on it.<br>"+
      "No change is given. Questions: Roy 09465363493</p>"+
    "<button class='btn' onclick='window.print()'>Save or print this receipt</button>";
  document.title = "Receipt " + or;
})();
